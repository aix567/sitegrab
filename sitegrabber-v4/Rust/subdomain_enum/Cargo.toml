[package]
name    = "subdomain_enum"
version = "3.0.0"
edition = "2021"
authors = ["Idris"]
description = "SiteGrabber v3.0 — Concurrent subdomain enumerator"

[[bin]]
name = "subdomain_enum"
path = "src/main.rs"

[dependencies]
tokio       = { version = "1",      features = ["full"] }
hickory-resolver = { version = "0.24", features = ["tokio-runtime"] }
reqwest     = { version = "0.12",   features = ["json", "rustls-tls"], default-features = false }
serde       = { version = "1",      features = ["derive"] }
serde_json  = "1"
clap        = { version = "4",      features = ["derive"] }
futures     = "0.3"
anyhow      = "1"

[profile.release]
opt-level = 3
lto       = true
strip     = true
